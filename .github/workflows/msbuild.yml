name: Build DLL
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Solution
        run: msbuild PrismTextureStreamerFB.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: PrismTextureStreamer-DLL
          path: "**/Release/*.dll"
